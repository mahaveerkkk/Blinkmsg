name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab with 1 click

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://oiqlbczaognjppzetsui.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_drQwDhNAcl59oc6mOMOsJg_HCrnG4oh' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Play Store AAB Bundle
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Prepare Output Play Store AAB Bundle
        run: |
          mkdir -p output_apks
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} output_apks/BlinkMsg-PlayStore-release.aab \; 2>/dev/null || true
          ls -la output_apks/

      - name: Upload AAB Bundle to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlinkMsg-PlayStore-AAB
          path: output_apks/
          retention-days: 30
