<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#00F5A0" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#00D4FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07080B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="50%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B24"/>
      <stop offset="50%" stop-color="#0D0F14"/>
      <stop offset="100%" stop-color="#06070A"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#07080B"/>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>

  <!-- Inner Squircle Plate -->
  <rect x="40" y="40" width="432" height="432" rx="108" fill="url(#plateGrad)" stroke="url(#neonGradient)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Outer Cyber Orbit -->
  <circle cx="256" cy="256" r="160" stroke="url(#neonGradient)" stroke-width="4" stroke-dasharray="16 12" opacity="0.5"/>

  <!-- Hexagonal Stealth Aperture Shield -->
  <path d="M256 120 L376 190 V322 L256 392 L136 322 V190 Z" 
        fill="#141722" stroke="url(#neonGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Geometric V-Cut Aperture Lens -->
  <path d="M 170 210 L 256 330 L 342 210" 
        stroke="url(#neonGradient)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)"/>

  <!-- Top Cloaking Chevron -->
  <path d="M 198 170 L 256 138 L 314 170" 
        stroke="url(#neonGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Quantum Core Particle -->
  <circle cx="256" cy="250" r="22" fill="#D4FF00" filter="url(#glowEffect)"/>
  <circle cx="256" cy="250" r="10" fill="#FFFFFF"/>
</svg>
